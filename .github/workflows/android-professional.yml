name: Android Professional APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Prepare Android project
        run: |
          cp android/app/google-services.json /tmp/google-services.json
          rm -rf android
          npx cap add android
          mkdir -p android/app
          cp /tmp/google-services.json android/app/google-services.json

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install Firebase configuration
        run: |
          test -f android/app/google-services.json
          python - <<'PY
          import json
          p="android/app/google-services.json"
          data=json.load(open(p))
          apps=data.get("client",[])
          if not apps:
              raise SystemExit("Invalid google-services.json: no Firebase clients found")
          package=apps[0].get("client_info",{}).get("android_client_info",{}).get("package_name")
          if package != "com.contentmonitor.app":
              raise SystemExit(f"Firebase package mismatch: {package!r}; expected 'com.contentmonitor.app'")
          print("Firebase package verified:", package)
          PY

      - name: Configure Android deep link
        shell: python
        run: |
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          marker="</activity>"
          intent='''<intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="com.contentmonitor.app" android:host="oauth" />
              </intent-filter>
          '''
          if 'android:scheme="com.contentmonitor.app"' not in s:
              s=s.replace(marker, intent+marker, 1)
          p.write_text(s)

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Content-Monitor-Pro-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
