name: Build Content Monitor Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Firebase configuration
        run: |
          test -s android/app/google-services.json
          node -e "const x=require('./android/app/google-services.json'); if(x.client?.[0]?.client_info?.android_client_info?.package_name !== 'com.contentmonitor.app') process.exit(1); console.log('Firebase package:', x.client[0].client_info.android_client_info.package_name)"

      - name: Build web assets
        run: npm run build

      - name: Backup Firebase configuration
        run: cp android/app/google-services.json /tmp/google-services.json

      - name: Generate fresh Capacitor Android project
        run: |
          rm -rf android
          npx cap add android
          cp /tmp/google-services.json android/app/google-services.json

      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android

      - name: Verify generated Android project
        run: |
          test -f android/gradlew
          test -f android/app/google-services.json
          grep -q "com.contentmonitor.app" android/app/build.gradle
          grep -q "com.google.gms.google-services" android/app/build.gradle

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: content-monitor-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
