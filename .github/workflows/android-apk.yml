name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app.js"
      - "index.html"
      - "styles.css"
      - "manifest.json"
      - "service-worker.js"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "native-notifications.js"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify toolchains
        run: |
          node --version
          npm --version
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"
          test "$(javac -version 2>&1 | awk '{print $2}' | cut -d. -f1)" = "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app for Android
        env:
          VITE_BASE: ./
        run: npm run build

      - name: Backup Firebase configuration
        run: |
          test -s android/app/google-services.json
          cp android/app/google-services.json /tmp/google-services.json

      - name: Create clean Capacitor Android project
        run: |
          rm -rf android
          npx cap add android
          cp /tmp/google-services.json android/app/google-services.json

      - name: Install native notification bridge
        run: |
          mkdir -p android/app/src/main/java/com/contentmonitor/app
          cat > android/app/src/main/java/com/contentmonitor/app/ContentMonitorNotificationsPlugin.java <<'JAVA'
          package com.contentmonitor.app;
          
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          
          import androidx.core.app.NotificationCompat;
          
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.ActivityCallback;
          
          @CapacitorPlugin(name = "ContentMonitorNotifications")
          public class ContentMonitorNotificationsPlugin extends Plugin {
              private static final String PREFS = "content_monitor_notifications";
              private static final String SOUND_URI = "sound_uri";
          
              @PluginMethod
              public void pickNotificationSound(PluginCall call) {
                  Uri existing = getSavedSound();
                  Intent intent = new Intent(RingtoneManager.ACTION_RINGTONE_PICKER);
                  intent.putExtra(RingtoneManager.EXTRA_RINGTONE_TYPE, RingtoneManager.TYPE_RINGTONE);
                  intent.putExtra(RingtoneManager.EXTRA_RINGTONE_TITLE, "Choose alert sound");
                  intent.putExtra(RingtoneManager.EXTRA_RINGTONE_SHOW_DEFAULT, true);
                  intent.putExtra(RingtoneManager.EXTRA_RINGTONE_EXISTING_URI, existing);
                  startActivityForResult(call, intent, "handleSoundPicker");
              }
          
              @ActivityCallback
              private void handleSoundPicker(PluginCall call, androidx.activity.result.ActivityResult result) {
                  Intent data = result.getData();
                  if (data == null) {
                      call.reject("Sound selection cancelled");
                      return;
                  }
                  Uri uri = data.getParcelableExtra(RingtoneManager.EXTRA_RINGTONE_PICKED_URI);
                  if (uri == null) {
                      getContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().remove(SOUND_URI).apply();
                      JSObject ret = new JSObject();
                      ret.put("uri", "");
                      ret.put("name", "Default");
                      call.resolve(ret);
                      return;
                  }
                  saveSound(uri);
                  JSObject ret = new JSObject();
                  ret.put("uri", uri.toString());
                  ret.put("name", RingtoneManager.getRingtone(getContext(), uri).getTitle(getContext()));
                  call.resolve(ret);
              }
          
              @PluginMethod
              public void getNotificationSound(PluginCall call) {
                  Uri uri = getSavedSound();
                  JSObject ret = new JSObject();
                  ret.put("uri", uri == null ? "" : uri.toString());
                  ret.put("name", uri == null ? "Default" : RingtoneManager.getRingtone(getContext(), uri).getTitle(getContext()));
                  call.resolve(ret);
              }
          
              private android.media.MediaPlayer testPlayer;

              @PluginMethod
              public void playAlertSound(PluginCall call) {
                  try {
                      if (testPlayer != null) {
                          try { testPlayer.stop(); } catch (Exception ignored) {}
                          testPlayer.release();
                      }
                      testPlayer = android.media.MediaPlayer.create(getContext(), com.contentmonitor.app.R.raw.alert_siren);
                      if (testPlayer == null) {
                          call.reject("Could not load alert_siren.wav");
                          return;
                      }
                      testPlayer.setOnCompletionListener(mp -> {
                          mp.release();
                          testPlayer = null;
                      });
                      testPlayer.start();
                      new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(() -> {
                          if (testPlayer != null) {
                              try { testPlayer.stop(); } catch (Exception ignored) {}
                              testPlayer.release();
                              testPlayer = null;
                          }
                      }, 10000);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Alert sound failed: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void notifyAlert(PluginCall call) {
                  showNotification(call.getString("title", "Content Monitor"), call.getString("body", ""));
                  call.resolve();
              }
          
              public static void ensureAlertChannel(Context context) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager manager = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                      String channelId = "content_monitor_alerts_v4";
                      if (manager.getNotificationChannel(channelId) == null) {
                          NotificationChannel channel = new NotificationChannel(channelId, "Content Monitor alerts", NotificationManager.IMPORTANCE_HIGH);
                          Uri sound = Uri.parse("android.resource://" + context.getPackageName() + "/" + com.contentmonitor.app.R.raw.alert_siren);
                          AudioAttributes attrs = new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_NOTIFICATION).build();
                          channel.setSound(sound, attrs);
                          channel.enableVibration(true);
                          manager.createNotificationChannel(channel);
                      }
                  }
              }
          
              private Uri getSavedSound() {
                  String value = getContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(SOUND_URI, "");
                  return value == null || value.isEmpty() ? null : Uri.parse(value);
              }
          
              private void saveSound(Uri uri) {
                  getContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString(SOUND_URI, uri.toString()).apply();
              }
          
              private void showNotification(String title, String body) {
                  Context context = getContext();
                  NotificationManager manager = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  Uri sound = getSavedSound();
                  String channelId = "content_monitor_alerts_v4";
          
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = manager.getNotificationChannel(channelId);
                      if (channel == null) {
                          channel = new NotificationChannel(channelId, "Content Monitor alerts", NotificationManager.IMPORTANCE_HIGH);
                          AudioAttributes attrs = new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_NOTIFICATION).build();
                          channel.setSound(sound, attrs);
                          channel.enableVibration(true);
                          manager.createNotificationChannel(channel);
                      }
                  }
          
                  Intent launch = context.getPackageManager().getLaunchIntentForPackage(context.getPackageName());
                  PendingIntent pending = null;
                  if (launch != null) {
                      launch.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      pending = PendingIntent.getActivity(context, 1001, launch, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  }
          
                  NotificationCompat.Builder builder = new NotificationCompat.Builder(context, channelId)
                          .setSmallIcon(context.getApplicationInfo().icon)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setAutoCancel(true)
                          .setCategory(NotificationCompat.CATEGORY_ALARM);
          
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) {
                      if (sound != null) builder.setSound(sound);
                      else builder.setDefaults(NotificationCompat.DEFAULT_SOUND);
                  }
                  if (pending != null) builder.setContentIntent(pending);
                  manager.notify((int)(System.currentTimeMillis() % 2000000000L), builder.build());
              }
          }
          
          JAVA
          cat > android/app/src/main/java/com/contentmonitor/app/MainActivity.java <<'JAVA'
          package com.contentmonitor.app;
          
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ContentMonitorNotificationsPlugin.class);
                  super.onCreate(savedInstanceState);
                  ContentMonitorNotificationsPlugin.ensureAlertChannel(this);
              }
          }
          
          JAVA

      - name: Generate 15-second alert siren
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import math
          import wave
          import struct
          from pathlib import Path

          out = Path("android/app/src/main/res/raw/alert_siren.wav")
          sample_rate = 44100
          duration = 10.0
          channels = 1
          amplitude = 0.45

          with wave.open(str(out), "wb") as wf:
              wf.setnchannels(channels)
              wf.setsampwidth(2)
              wf.setframerate(sample_rate)

              total = int(sample_rate * duration)
              for i in range(total):
                  t = i / sample_rate
                  cycle = t % 2.0
                  if cycle < 1.0:
                      freq = 700.0 + 650.0 * cycle
                  else:
                      freq = 1350.0 - 650.0 * (cycle - 1.0)

                  fade = min(1.0, t / 0.05, (duration - t) / 0.05)
                  value = amplitude * fade * math.sin(2.0 * math.pi * freq * t)
                  wf.writeframes(struct.pack("<h", int(value * 32767)))

          print(f"Created {out} ({out.stat().st_size} bytes)")
          PY
      - name: Set FCM default notification channel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          meta='<meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="content_monitor_alerts_v4" />'
          if 'com.google.firebase.messaging.default_notification_channel_id' not in s:
              pos=s.rfind('</application>')
              if pos<0: raise SystemExit('application tag not found')
              s=s[:pos]+"        "+meta+"\n    "+s[pos:]
              p.write_text(s)
          PY
      - name: Register TikTok deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '''<intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="com.contentmonitor.app" android:host="oauth" android:path="/tiktok" />
              </intent-filter>'''
          if 'android:scheme="com.contentmonitor.app"' not in s:
              start = s.find("<activity")
              if start < 0:
                  raise SystemExit("MainActivity declaration not found")
              end = s.find(">", start)
              if end < 0:
                  raise SystemExit("Activity opening tag not found")
              s = s[:end+1] + "\n            " + marker.replace("\n", "\n            ") + s[end+1:]
              p.write_text(s)
          PY

      - name: Configure Android
        run: |
          printf '\norg.gradle.java.home=%s\n' "$JAVA_HOME" >> android/gradle.properties
          test -s android/app/google-services.json
          grep -q 'com.contentmonitor.app' android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: content-monitor-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
