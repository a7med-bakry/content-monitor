name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify toolchains
        run: |
          node --version
          npm --version
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"
          test "$(javac -version 2>&1 | awk '{print $2}' | cut -d. -f1)" = "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app for Android
        env:
          VITE_BASE: ./
        run: npm run build

      - name: Backup Firebase configuration
        run: |
          test -s android/app/google-services.json
          cp android/app/google-services.json /tmp/google-services.json

      - name: Create clean Capacitor Android project
        run: |
          rm -rf android
          npx cap add android
          cp /tmp/google-services.json android/app/google-services.json

      - name: Configure Android
        run: |
          printf '\norg.gradle.java.home=%s\n' "$JAVA_HOME" >> android/gradle.properties
          test -s android/app/google-services.json
          grep -q 'com.contentmonitor.app' android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: content-monitor-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
