name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app.js"
      - "index.html"
      - "styles.css"
      - "manifest.json"
      - "service-worker.js"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "native-notifications.js"
      - "monitor-ui.js"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify toolchains
        run: |
          node --version
          npm --version
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"
          test "$(javac -version 2>&1 | awk '{print $2}' | cut -d. -f1)" = "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app for Android
        env:
          VITE_BASE: ./
        run: npm run build

      - name: Backup Firebase configuration
        run: |
          test -s android/app/google-services.json
          cp android/app/google-services.json /tmp/google-services.json

      - name: Create clean Capacitor Android project
        run: |
          rm -rf android
          npx cap add android
          cp /tmp/google-services.json android/app/google-services.json

      - name: Create native notification channel before FCM can receive
        run: |
          mkdir -p android/app/src/main/java/com/contentmonitor/app
          cat > android/app/src/main/java/com/contentmonitor/app/ContentMonitorApplication.java <<'JAVA'
          package com.contentmonitor.app;

          import android.app.Application;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.os.Build;

          public class ContentMonitorApplication extends Application {
              public static final String CHANNEL_ID = "content_monitor_alerts";
              @Override
              public void onCreate() {
                  super.onCreate();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "Content Monitor alerts", NotificationManager.IMPORTANCE_HIGH);
                      channel.setDescription("Monitoring alerts");
                      channel.setSound(android.provider.Settings.System.DEFAULT_NOTIFICATION_URI, null);
                      channel.enableVibration(true);
                      nm.createNotificationChannel(channel);
                  }
              }
          }
          JAVA

      - name: Set FCM default notification channel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          meta='<meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="content_monitor_alerts" />'
          if 'com.google.firebase.messaging.default_notification_channel_id' not in s:
              pos=s.rfind('</application>')
              if pos<0: raise SystemExit('application tag not found')
              s=s[:pos]+"        "+meta+"\n    "+s[pos:]
          if 'android:name="com.contentmonitor.app.ContentMonitorApplication"' not in s:
              pos=s.find('<application')
              if pos<0: raise SystemExit('application tag not found')
              end=s.find('>',pos)
              if end<0: raise SystemExit('application opening tag not found')
              s=s[:pos]+s[pos:end]+' android:name="com.contentmonitor.app.ContentMonitorApplication"'+s[end:]
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              pos=s.find('<application')
              if pos<0: raise SystemExit('application tag not found')
              s=s[:pos]+'    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    '+s[pos:]
          p.write_text(s)
          PY
      - name: Register TikTok deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '''<intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="com.contentmonitor.app" android:host="oauth" android:path="/tiktok" />
              </intent-filter>'''
          if 'android:scheme="com.contentmonitor.app"' not in s:
              start = s.find("<activity")
              if start < 0:
                  raise SystemExit("MainActivity declaration not found")
              end = s.find(">", start)
              if end < 0:
                  raise SystemExit("Activity opening tag not found")
              s = s[:end+1] + "\n            " + marker.replace("\n", "\n            ") + s[end+1:]
              p.write_text(s)
          PY

      - name: Configure Android
        run: |
          printf '\norg.gradle.java.home=%s\n' "$JAVA_HOME" >> android/gradle.properties
          test -s android/app/google-services.json
          grep -q 'com.contentmonitor.app' android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: content-monitor-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
