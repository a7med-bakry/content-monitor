<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css"><title>Content Monitor</title>
</head>
<body>
<div class="app">
  <header class="topbar"><div><div class="eyebrow">CONTENT MONITOR</div><h1>My Content</h1></div><button class="icon-btn" id="addBtn">＋</button></header>
  <main>
    <section class="summary"><div><span>Monitored</span><strong id="total">3</strong></div><div><span>Normal</span><strong class="ok" id="normal">2</strong></div><div><span>Alerts</span><strong class="bad" id="alerts">1</strong></div></section>
    <div class="section-head"><h2>Reels</h2><button class="text-btn" id="manageBtn">Manage</button></div>
    <section id="reels" class="reels"></section>
  </main>
  <nav class="bottom"><button class="active">⌂<span>Home</span></button><button>◉<span>Accounts</span></button><button id="newReel">＋<span>Add Reel</span></button><button>⚙<span>Settings</span></button></nav>
</div>
<div class="modal hidden" id="modal"><div class="sheet"><button class="close" id="closeBtn">×</button><h2>Add monitored Reel</h2><label>Platform<select id="platform"><option>Instagram</option><option>TikTok</option></select></label><label>Reel URL<input id="url" placeholder="https://..."></label><div class="grid"><label>Expected views / hour<input id="views" type="number" value="100"></label><label>Expected likes / 3 hours<input id="likes" type="number" value="10"></label></div><button class="primary" id="saveBtn">Add Reel</button></div></div>
<script src="app.js"></script>
</body></html>
