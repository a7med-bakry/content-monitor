<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0f"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>Content Monitor</title></head><body><div class="app">
<header class="topbar"><div><div class="eyebrow">CONTENT MONITOR</div><h1>My Reels</h1></div><button class="icon-btn" id="addBtn">＋</button></header>
<main><section class="summary"><div><span>Monitored</span><strong id="total">0</strong></div><div><span>Active</span><strong class="ok" id="normal">0</strong></div><div><span>Alerts</span><strong class="bad" id="alerts">0</strong></div></section><div class="section-head"><h2>Reels</h2><button class="text-btn" id="refreshBtn">Refresh</button></div><section id="reels" class="reels"></section></main>
<nav class="bottom"><button class="active" id="homeBtn">⌂<span>Home</span></button><button id="newReel">＋<span>Add Reel</span></button><button id="settingsBtn">⚙<span>Settings</span></button></nav></div>

<div class="modal hidden" id="modal"><div class="sheet"><button class="close" id="closeBtn">×</button><div class="modal-icon">＋</div><h2>Add Reel</h2><p class="hint">Paste the link and the platform will be detected automatically.</p><label>Reel / Video link<input id="url" autocomplete="off" placeholder="Instagram or TikTok URL"></label><div id="platformDetected" class="platform-detected hidden"></div><label>Clip name<input id="title" placeholder="e.g. My campaign clip"></label><div class="grid"><label>Start<input id="start" type="datetime-local"></label><label>End<input id="end" type="datetime-local"></label></div><div class="settings-card"><div class="settings-title">Alert rules</div><div class="settings-subtitle">Set these independently for this Reel.</div><div class="grid"><label>Check after<select id="alertDelay"><option value="5">5 min</option><option value="10">10 min</option><option value="15" selected>15 min</option><option value="30">30 min</option><option value="60">60 min</option></select></label><label>Repeat every<select id="alertRepeat"><option value="15">15 min</option><option value="30">30 min</option><option value="60" selected>60 min</option><option value="120">2 hours</option><option value="180">3 hours</option><option value="360">6 hours</option><option value="720">12 hours</option></select></label></div><label>Minimum views increase<div class="number-field"><input id="minViews" type="number" min="1" value="100"><span>views</span></div></label><div class="rule-preview" id="rulePreview"></div></div><div class="fixed-snapshot"><span>Snapshots</span><b>Every 5 minutes</b></div><button class="primary" id="saveBtn">Add Reel</button></div></div>

<div class="modal hidden" id="settingsModal"><div class="sheet"><button class="close" id="settingsClose">×</button><h2>Settings</h2><p class="hint">Every active Reel gets a snapshot every 5 minutes.</p><button class="secondary" id="enableNotifications">Enable Notifications</button></div></div>
<script type="module" src="./app.js?v=17"></script></body></html>
